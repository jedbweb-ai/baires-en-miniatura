<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baires en miniatura</title>
<meta name="description" content="Buenos Aires en un planeta de bolsillo: una maqueta 3D interactiva de la Ciudad con sus lugares más queridos.">
<meta name="theme-color" content="#d4e6f3">
<meta property="og:type" content="website">
<meta property="og:title" content="Baires en miniatura">
<meta property="og:description" content="Buenos Aires en un planeta de bolsillo: 25 lugares, el Subte y el Río de la Plata en una maqueta 3D interactiva.">
<meta property="og:url" content="https://jedbweb-ai.github.io/baires-en-miniatura/">
<meta property="og:image" content="https://jedbweb-ai.github.io/baires-en-miniatura/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2374acdf'/%3E%3Crect x='2' y='24' width='60' height='16' fill='%23fff'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23f2b134'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('intro');</script>
<style>
:root{
  --paper:#fbf8f2; --card:rgba(255,253,249,.86); --ink:#1b2230; --muted:#5d6676; --line:rgba(27,34,48,.10);
  --celeste:#74acdf; --sol:#f2b134; --accent:#2f6fae;
  --sky-a:#fbf4e8; --sky-b:#d4e6f3; --sky-c:#b9d5ea;
  --shadow:0 10px 30px -12px rgba(27,34,48,.28), 0 2px 6px rgba(27,34,48,.06);
  --r:16px; --display:'Young Serif', Georgia, serif; --ui:'Manrope', system-ui, sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#121a2a; --card:rgba(20,28,44,.84); --ink:#eef2f8; --muted:#a3adbf; --line:rgba(238,242,248,.12);
  --accent:#8cbcf0; --sky-a:#1c2a48; --sky-b:#0e1628; --sky-c:#070b16;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--ui);color:var(--ink);background:radial-gradient(120% 90% at 50% 42%,var(--sky-a) 0%,var(--sky-b) 55%,var(--sky-c) 100%);transition:background .8s;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.dragging{cursor:grabbing}
.glass{background:var(--card);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line);box-shadow:var(--shadow)}

/* Barra superior */
.bar{position:fixed;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:5}
.bar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 10px;border-radius:var(--r)}
.brand svg{width:30px;height:30px;flex:none}
.brand-name{font-family:var(--display);font-size:24px;font-weight:400;letter-spacing:-.01em;line-height:1}
.brand-sub{font-size:12px;color:var(--muted);font-weight:500;margin-left:2px;align-self:flex-end;padding-bottom:2px}
.actions{display:flex;gap:8px;align-items:center}
.chip{height:44px;padding:0 16px;border-radius:14px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.chip:hover{background:var(--paper)}
.primary{height:44px;padding:0 8px 0 18px;border-radius:14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--paper);box-shadow:var(--shadow)}
.primary .ico{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.14);display:grid;place-items:center}
:root[data-theme="dark"] .primary .ico{background:rgba(0,0,0,.12)}
.primary[aria-pressed="true"]{background:var(--sol);color:#1b2230}

/* Lista de lugares */
.list{position:fixed;top:72px;right:16px;width:320px;max-height:calc(100vh - 168px);overflow:auto;border-radius:var(--r);padding:8px;z-index:6;transform-origin:top right;transition:opacity .2s,transform .2s}
.list.closed{opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none}
.list h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px 8px}
.list ol{list-style:none}
.list li button{width:100%;display:grid;grid-template-columns:34px 1fr;align-items:center;gap:8px;text-align:left;padding:8px 10px;border-radius:12px}
.list li button:hover,.list li button[aria-current="true"]{background:var(--paper)}
.list .num{font-family:var(--display);font-size:15px;color:var(--c);font-weight:400}
.list .nm{font-weight:600;font-size:14px;display:block}
.list .sb{font-size:12px;color:var(--muted)}

/* Ficha */
.panel{position:fixed;top:72px;right:16px;bottom:16px;width:380px;border-radius:20px;z-index:7;overflow:auto;overscroll-behavior:contain;padding:22px 22px 18px;transform:translateX(calc(100% + 24px));transition:transform .45s cubic-bezier(.2,.8,.2,1)}
body.panel-open .panel{transform:none}
.grab{display:none}
.p-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--c)}
.panel h2{font-family:var(--display);font-weight:400;font-size:32px;line-height:1.05;letter-spacing:-.015em;margin-top:6px}
.p-sub{color:var(--muted);font-size:14px;margin-top:4px}
.p-tools{display:flex;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line)}
.icon-btn:hover{border-color:var(--ink)}
.photo{position:relative;margin-top:18px;border-radius:14px;overflow:hidden;aspect-ratio:16/10;background:linear-gradient(135deg,var(--c),#1b2230)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(10,14,24,.72))}
.photo figcaption{position:absolute;left:16px;right:16px;bottom:12px;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;color:#fff}
.year{font-family:var(--display);font-size:46px;line-height:.9;font-weight:400}
.yearl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;text-align:right;max-width:55%}
.pcredit{font-size:11px;color:var(--muted);margin-top:6px}
.pcredit a{text-decoration-color:var(--line)}
.p-actions{display:flex;gap:8px;margin-top:14px}
.btn-go{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;height:46px;padding:0 16px;border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;font-size:14px}
:root[data-theme="dark"] .btn-go{color:#0e1628}
.btn-go small{font-weight:500;opacity:.8;font-size:12px}
.btn-web{height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;font-weight:600;font-size:14px;text-decoration:none;background:var(--paper)}
.desc{margin-top:16px;font-size:15px;line-height:1.6;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 10px 12px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:20px;line-height:1.1;overflow-wrap:anywhere}
.stat span{display:block;font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}
.tip{margin-top:14px;border-left:3px solid var(--sol);padding:4px 0 4px 12px;font-size:14px;line-height:1.55}
.tip b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.p-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.p-nav button{height:40px;padding:0 12px;border-radius:10px;font-weight:600;font-size:14px}
.p-nav button:hover{background:var(--paper)}
.p-nav span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
body.panel-min .panel{transform:translateY(calc(100% - 128px))}

/* Etiquetas sobre la maqueta */
#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.pin{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:0;height:28px;padding:0 4px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:0 4px 12px -4px rgba(27,34,48,.35);font-size:12px;font-weight:700;white-space:nowrap;transition:opacity .25s,gap .2s,padding .2s;will-change:transform}
.pin b{width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700}
.pin span{max-width:0;overflow:hidden;transition:max-width .25s}
.pin:hover,.pin.sel,body.names .pin{gap:6px;padding:0 10px 0 4px}
.pin:hover span,.pin.sel span,body.names .pin span{max-width:240px}
.pin.sel{background:var(--ink);color:var(--paper)}
.pin.off{opacity:0;pointer-events:none}
html.intro .pin{opacity:0}

/* Dock inferior */
.dock{position:fixed;left:16px;bottom:16px;display:flex;gap:8px;z-index:5}
.dock button{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.dock button:hover{background:var(--paper)}
.dock button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);font-size:13px;color:var(--muted);padding:8px 14px;border-radius:999px;z-index:4;white-space:nowrap;transition:opacity .4s}
.credit{position:fixed;right:16px;bottom:16px;font-size:12px;color:var(--muted);padding:7px 12px;border-radius:999px;z-index:4}
.credit a{font-weight:600;color:var(--ink);text-decoration:none}
.follow{position:fixed;left:50%;top:76px;transform:translateX(-50%);font-size:13px;font-weight:600;padding:8px 8px 8px 14px;border-radius:999px;z-index:5;display:flex;gap:10px;align-items:center}
.follow button{height:30px;padding:0 12px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:12px;font-weight:700}
body.touched .hint,body.panel-open .hint,body.panel-open .credit,body.subte-on .hint{opacity:0;pointer-events:none}

/* Ayuda de teclado */
.help{position:fixed;left:16px;bottom:74px;width:300px;border-radius:var(--r);padding:16px;z-index:6;font-size:13px}
.help h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.help dl{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.help dt kbd{font-family:var(--ui);font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;border:1px solid var(--line);background:var(--paper);white-space:nowrap}
.help dd{color:var(--muted)}

/* Leyenda del Subte */
.legend{position:fixed;left:16px;bottom:74px;width:310px;max-height:calc(100vh - 170px);overflow:auto;border-radius:var(--r);padding:14px 16px;z-index:6;font-size:13px}
.legend h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.legend ul{list-style:none}
.legend li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;padding:5px 0}
.legend .ln{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;background:var(--c)}
.legend .ln.lt{color:#1b2230}
.legend b{display:block;font-weight:600;font-size:13px}
.legend span{color:var(--muted);font-size:12px}
.legend-note{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.45}

/* Cargador */
.loader{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:radial-gradient(120% 90% at 50% 42%,var(--sky-a),var(--sky-b));transition:opacity .9s .2s,visibility 0s 1.1s}
.loader.done{opacity:0;visibility:hidden}
.loader .word{font-size:13px;letter-spacing:.42em;font-weight:700;text-align:center;padding-left:.42em}
.loader .track{width:140px;height:2px;background:var(--line);margin:14px auto 0;border-radius:2px;overflow:hidden}
.loader i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:760px){
  .bar{top:12px;left:12px;right:12px}
  .brand{padding:6px 12px 6px 8px}.brand-name{font-size:20px}.brand-sub{display:none}
  .chip{padding:0 12px}.primary{padding:0 6px 0 14px}
  .primary .lbl-long{display:none}
  .list{left:12px;right:12px;width:auto;top:66px}
  .panel{left:0;right:0;bottom:0;top:auto;width:auto;max-height:62vh;border-radius:22px 22px 0 0;transform:translateY(105%);padding:18px 18px calc(16px + env(safe-area-inset-bottom))}
  .panel h2{font-size:26px}
  .grab{display:block;width:100%;height:22px;margin:-10px 0 4px;position:relative}
  .grab::before{content:"";position:absolute;left:50%;top:8px;width:42px;height:5px;margin-left:-21px;border-radius:3px;background:var(--line);box-shadow:inset 0 0 0 1px var(--line)}
  body.panel-min .panel{transform:translateY(calc(100% - 118px))}
  .hint{bottom:76px;font-size:12px}
  .credit{left:auto;right:12px;bottom:16px}
  .dock{left:12px;bottom:12px}
  .help,.legend{left:12px;right:12px;width:auto}
  .legend ul{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .legend li{grid-template-columns:24px 1fr;gap:8px}
  .legend b{font-size:12px;line-height:1.25}
  .legend li>span>span,.legend-note{display:none}
}
@media (max-width:420px){ .chip .lbl-long{display:none} .credit{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = id => document.getElementById(id);
const D2R = Math.PI/180, R = 18, U = R*D2R;          // U: unidades de escena por grado del planeta
const V3 = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);
const clamp = THREE.MathUtils.clamp, lerp = THREE.MathUtils.lerp;
const smooth = (a,b,x) => { const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ==========================================================================
   Proyección: la Ciudad real (lat/lon) sobre un planeta de bolsillo.
   Centro en el Obelisco; la distancia se comprime (d^0.6) para que el centro
   tenga lugar y Palermo o La Boca sigan entrando en la misma cara.
   Espacio "P": plano azimutal en grados del planeta (x = este, y = norte).
   ========================================================================== */
const LAT0 = -34.6037, LON0 = -58.3816, KA = 17, KK = 0.6, COSL = Math.cos(LAT0*D2R);
const toKm = (lat,lon) => [(lon-LON0)*COSL*111.32, (lat-LAT0)*110.574];
function kmToP(x,y){ const d = Math.hypot(x,y); if(d < 1e-9) return [0,0]; const t = KA*Math.pow(d,KK); return [t*x/d, t*y/d]; }
function pToKm(px,py){ const t = Math.hypot(px,py); if(t < 1e-9) return [0,0]; const d = Math.pow(t/KA,1/KK); return [px/t*d, py/t*d]; }
const llToP = (lat,lon) => kmToP(...toKm(lat,lon));
function pToDir(px,py,out = V3()){ const t = Math.hypot(px,py); if(t < 1e-9) return out.set(0,0,1); const s = Math.sin(t*D2R)/t; return out.set(px*s, py*s, Math.cos(t*D2R)); }
function dirToP(n){ const t = Math.acos(clamp(n.z,-1,1))/D2R, h = Math.hypot(n.x,n.y); if(h < 1e-9) return [0,0]; return [n.x/h*t, n.y/h*t]; }

const people = []; let bodyIM = null, headIM = null;
function spawnPeople(){
  for(const r of ROADS) for(const piece of r.pieces){ const P = pathFrom(piece), n = Math.round(P.len*1.4);
    for(let i=0;i<n;i++) people.push({ kind:'walk', P, s:rand()*P.len, v:(rand() < .5 ? -1 : 1)*(.07+rand()*.06), lane:(rand() < .5 ? -1 : 1)*(r.w/2+.07+rand()*.03) }); }

   keys:[['Arrastar','Girar o planeta ou o lugar escolhido'],['Roda','Aproximar ou afastar'],['← →','Lugar anterior ou próximo'],['N','Dia ou noite'],['S','Mostrar o Subte'],['Espaço','Pausar o giro'],['H','Visão geral'],['Esc','Fechar a ficha']], loadErr:'Seu navegador não consegue mostrar a maquete 3D' };
const LANGS = ['es','en','pt'];
let LANG = 'es'; try { const s = localStorage.getItem('baires-lang'); if(LANGS.includes(s)) LANG = s; else { const nl = navigator.language.slice(0,2); LANG = LANGS.includes(nl) ? nl : 'en'; } } catch(_){}
const T = k => UI[LANG][k];
let current = null, tour = null, night = false, nightK = 0, panelMin = false;
const pad = i => String(i+1).padStart(2,'0');

const labels = PLACES.map(p => { const b = document.createElement('button'); b.className = 'pin off'; b.style.setProperty('--c',CATS[p.cat].c);
  b.innerHTML = `<b>${pad(PLACES.indexOf(p))}</b><span></span>`; b.addEventListener('click',() => select(p.id)); $('labels').appendChild(b); p.lbl = b; return b; });

function renderTexts(){
  document.documentElement.lang = LANG === 'pt' ? 'pt-BR' : LANG;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = T(el.dataset.t));
  $('langLbl').textContent = LANG.toUpperCase(); $('langBtn').setAttribute('aria-label',T('lang'));
  $('listTitle').textContent = T('listTitle').replace('{n}',PLACES.length);
  $('hint').textContent = T('hint'); $('credit').innerHTML = T('credit'); canvas.setAttribute('aria-label',T('canvas'));
  $('homeBtn').setAttribute('aria-label',T('home')); $('helpBtn').setAttribute('aria-label',T('help'));
  $('nightBtn').setAttribute('aria-label',night ? T('day') : T('night')); $('spinBtn').setAttribute('aria-label',spin ? T('pause') : T('resume'));
  $('tourBtn').querySelector('[data-t]').textContent = tour ? T('tourStop') : T('tour');
  $('subteBtn').setAttribute('aria-label',subteOn ? T('subteHide') : T('subte'));
  $('legendTitle').textContent = T('subteTitle'); $('legendNote').textContent = T('subteNote');
  $('legendList').innerHTML = SUBTE.map(L => '<li><span class="ln' + (L.id==='H' ? ' lt' : '') + '" style="--c:' + L.c + '">' + L.id + '</span><span><b>' + L.ends + '</b><span>' + L.year + ' · ' + L[LANG] + '</span></span></li>').join('');
  $('helpTitle').textContent = T('help'); $('helpList').innerHTML = T('keys').map(([k,v]) => `<dt><kbd>${k}</kbd></dt><dd>${v}</dd>`).join('');
  $('listItems').innerHTML = PLACES.map((p,i) => `<li><button data-id="${p.id}" style="--c:${CATS[p.cat].c}" ${current===p?'aria-current="true"':''}><span class="num">${pad(i)}</span><span><span class="nm">${p[LANG].name}</span><span class="sb">${p[LANG].sub}</span></span></button></li>`).join('');
  PLACES.forEach(p => p.lbl.querySelector('span').textContent = p[LANG].name);
  if(current) fillPanel(current);
}
const fileUrl = f => 'https://commons.wikimedia.org/wiki/File:' + encodeURIComponent(f.replace(/ /g,'_'));
const imgUrl = f => 'https://commons.wikimedia.org/wiki/Special:FilePath/' + encodeURIComponent(f) + '?width=960';
function fillPanel(p){
  const t = p[LANG], cat = CATS[p.cat], i = PLACES.indexOf(p);
  const el = $('panel'); el.style.setProperty('--c',cat.c);
  el.innerHTML = `
   <button class="grab" id="pGrab" aria-label="${panelMin ? T('expand') : T('minimize')}"></button>
   <div class="p-head"><div><p class="eyebrow">${pad(i)} — ${cat[LANG]}</p><h2>${t.name}</h2><p class="p-sub">${t.sub}</p></div>
     <div class="p-tools"><button class="icon-btn" id="pMin" aria-label="${panelMin ? T('expand') : T('minimize')}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">${panelMin ? '<path d="M6 15l6-6 6 6"/>' : '<path d="M5 12h14"/>'}</svg></button>
     <button class="icon-btn" id="pClose" aria-label="${T('close')}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>
   <figure class="photo"><img src="${imgUrl(p.photo.f)}" alt="${t.name}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()"><figcaption><span class="year">${p.year}</span><span class="yearl">${t.yearl}</span></figcaption></figure>
   <p class="pcredit">${T('photo')}: ${p.photo.a} · <a href="${fileUrl(p.photo.f)}" target="_blank" rel="noopener">${p.photo.l} · Wikimedia Commons</a></p>
   <div class="p-actions"><a class="btn-go" href="https://www.google.com/maps/search/?api=1&query=${p.ll[0]},${p.ll[1]}" target="_blank" rel="noopener"><span>${T('go')}</span><small>${T('maps')} ↗</small></a>
     <a class="btn-web" href="${p.web}" target="_blank" rel="noopener">${T('web')} ↗</a></div>
   <p class="desc">${t.desc}</p>
   <div class="stats">${t.stats.map(([a,b]) => `<div class="stat"><b>${a}</b><span>${b}</span></div>`).join('')}</div>
   <div class="tip"><b>${T('tip')}</b>${t.tip}</div>
   <div class="p-nav"><button id="pPrev">← ${T('prev')}</button><span>${pad(i)} / ${pad(PLACES.length-1)}</span><button id="pNext">${T('next')} →</button></div>`;
  $('pClose').onclick = closePanel; $('pPrev').onclick = () => { stopTour(); step(-1); }; $('pNext').onclick = () => { stopTour(); step(1); };
  $('pMin').onclick = $('pGrab').onclick = () => { panelMin = !panelMin; document.body.classList.toggle('panel-min',panelMin); fillPanel(p); };
}
function select(id){
  const p = PLACES.find(q => q.id === id); if(!p) return; current = p;
  PLACES.forEach(q => q.lbl.classList.toggle('sel',q === p));
  ringMark.visible = true; ringMark.position.copy(p.f.n).multiplyScalar(R+.03); ringMark.quaternion.setFromUnitVectors(V3(0,0,1),p.f.n); ringMark.scale.setScalar(p.foot+.15);
  fo.place = p; fo.yaw = YAW[p.face] + .45; fo.tilt = .95; fo.dist = 6 + p.foot*2.6 + p.top*1.5;
  flyTo('focus', mode === 'focus' ? 1.4 : 1.8);
  panelMin = false; document.body.classList.remove('panel-min'); fillPanel(p); document.body.classList.add('panel-open'); $('panel').scrollTop = 0;
  toggleList(false); renderListCurrent();
}
function renderListCurrent(){ document.querySelectorAll('#listItems button').forEach(b => b.toggleAttribute('aria-current',current && b.dataset.id === current.id)); }
function closePanel(){ document.body.classList.remove('panel-open','panel-min'); stopTour(); goHome(); }
function goHome(){ current = null; ringMark.visible = false; PLACES.forEach(q => q.lbl.classList.remove('sel')); document.body.classList.remove('panel-open','panel-min');
  ov.az = Math.round((ov.az-HOME.az)/(Math.PI*2))*Math.PI*2 + HOME.az; ov.el = HOME.el; ov.dist = homeDist(); flyTo('over',1.6); renderListCurrent(); }
function step(k){ const i = current ? PLACES.indexOf(current) : -1; select(PLACES[(i+k+PLACES.length)%PLACES.length].id); }
function startTour(){ stopTour(); select(PLACES[0].id); tour = setInterval(() => step(1), 8000); $('tourBtn').setAttribute('aria-pressed','true'); renderTexts(); }
function stopTour(){ if(!tour) return; clearInterval(tour); tour = null; $('tourBtn').setAttribute('aria-pressed','false'); renderTexts(); }
function toggleList(force){ const l = $('list'), open = force ?? l.classList.contains('closed'); l.classList.toggle('closed',!open); $('listBtn').setAttribute('aria-expanded',String(open)); }
function setNight(v){ night = v; document.documentElement.dataset.theme = v ? 'dark' : 'light'; $('nightBtn').setAttribute('aria-pressed',String(v)); renderTexts(); }
function setSpin(v){ spin = v; $('spinBtn').setAttribute('aria-pressed',String(!v)); $('spinIco').innerHTML = v ? '<path d="M9 6v12M15 6v12"/>' : '<path d="M8 5l11 7-11 7z"/>'; renderTexts(); }

$('brand').onclick = () => { stopTour(); goHome(); };
$('homeBtn').onclick = () => { stopTour(); goHome(); };
$('langBtn').onclick = () => { LANG = LANGS[(LANGS.indexOf(LANG)+1)%LANGS.length]; try { localStorage.setItem('baires-lang',LANG); } catch(_){} renderTexts(); };
$('listBtn').onclick = () => toggleList();
$('listItems').addEventListener('click', e => { const b = e.target.closest('button[data-id]'); if(b){ stopTour(); select(b.dataset.id); } });
$('tourBtn').onclick = () => tour ? stopTour() : startTour();
$('nightBtn').onclick = () => setNight(!night);
$('spinBtn').onclick = () => setSpin(!spin);
$('subteBtn').onclick = () => setSubte(!subteOn);
$('helpBtn').onclick = () => { if(subteOn) setSubte(false); const h = $('help'); h.hidden = !h.hidden; $('helpBtn').setAttribute('aria-pressed',String(!h.hidden)); };
addEventListener('keydown', e => { if(e.target.closest?.('input,textarea')) return;
  if(e.key === 'ArrowRight'){ stopTour(); step(1); } else if(e.key === 'ArrowLeft'){ stopTour(); step(-1); }
  else if(e.key === 'Escape'){ if(!$('list').classList.contains('closed')) toggleList(false); else if(!$('help').hidden) $('helpBtn').click(); else if(current) closePanel(); }
  else if(e.key === 'n' || e.key === 'N') setNight(!night); else if(e.key === 's' || e.key === 'S') setSubte(!subteOn); else if(e.key === 'h' || e.key === 'H'){ stopTour(); goHome(); }
  else if(e.key === ' ' && e.target === document.body){ e.preventDefault(); setSpin(!spin); } });
addEventListener('pointerdown', e => { if(!e.target.closest('#list,#listBtn')) toggleList(false); });

/* ---------- Etiquetas ---------- */
const _v = V3(), _c = V3();
function stepLabels(){
  const W = innerWidth, H = innerHeight; camera.getWorldPosition(_c);
  const placed = [], order = current ? [current, ...PLACES.filter(p => p !== current)] : PLACES;
  for(const p of order){
    const facing = p.f.n.dot(_c.clone().sub(p.anchor).normalize());
    _v.copy(p.anchor).project(camera);
    const x = (_v.x+1)/2*W, y = (1-_v.y)/2*H;
    let off = facing < .12 || _v.z > 1 || (mode === 'focus' && current !== p && p.anchor.distanceTo(_c) > fo.dist*3.2);
    // si dos etiquetas se pisan, se muestra la primera (la elegida o la de menor número)
    if(!off && p !== current && placed.some(([qx,qy]) => Math.abs(qx-x) < 26 && Math.abs(qy-y) < 24)) off = true;
    if(!off) placed.push([x,y]);
    p.lbl.classList.toggle('off',off);
    if(!off) p.lbl.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-120%)`;
  }
}

/* ---------- Día y noche ---------- */
const DAY = { hemi:.55, sun:2.3, moon:0, exp:1.05, water:new THREE.Color('#93b6b2') }, NIGHT = { hemi:.12, sun:.12, moon:.55, exp:.95, water:new THREE.Color('#2c4258') };
const hemiDay = { sky:new THREE.Color('#eef5ff'), gnd:new THREE.Color('#b8a888') }, hemiNight = { sky:new THREE.Color('#4a5f9a'), gnd:new THREE.Color('#1b2233') };
let stars = null;
function buildStars(){ const n = 900, p = new Float32Array(n*3), r = rng(77); for(let i=0;i<n;i++){ const u = r()*2-1, t = r()*Math.PI*2, s = Math.sqrt(1-u*u); p.set([s*Math.cos(t)*220,u*220,s*Math.sin(t)*220],i*3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(p,3));
  stars = new THREE.Points(g,new THREE.PointsMaterial({ color:'#ffffff', size:1.6, sizeAttenuation:false, transparent:true, opacity:0, depthWrite:false })); scene.add(stars); }
function stepNight(dt,t){
  nightK += ((night ? 1 : 0) - nightK)*Math.min(1,dt*2.2); const k = nightK;
  hemi.intensity = lerp(DAY.hemi,NIGHT.hemi,k); hemi.color.copy(hemiDay.sky).lerp(hemiNight.sky,k); hemi.groundColor.copy(hemiDay.gnd).lerp(hemiNight.gnd,k);
  sun.intensity = lerp(DAY.sun,NIGHT.sun,k); moon.intensity = lerp(DAY.moon,NIGHT.moon,k); renderer.toneMappingExposure = lerp(DAY.exp,NIGHT.exp,k);
  if(planetWater) planetWater.material.color.copy(DAY.water).lerp(NIGHT.water,k);
  scene.environment = k > .5 ? null : ENV;   // sin reflejos de "estudio" de noche
  if(buildingMat) buildingMat.emissiveIntensity = k*1.25; if(lampMat) lampMat.emissiveIntensity = k*3;
  OBELISK.emissiveIntensity = k*.75; BAROLO_LIGHT.emissiveIntensity = k*(2.2+Math.sin(t*2.5)*.6);
  PLANET_RING.emissiveIntensity = k*1.6; PLANET_RING.emissive.setHSL((t*.05)%1,.75,.55);
  if(stars) stars.material.opacity = k*.9;
  for(const L of SUBTE) if(L.mat) L.mat.emissiveIntensity = .35 + k*.9;
  if(atmosphere){ atmosphere.material.uniforms.c.value.set(k > .5 ? '#6f8cff' : '#ffffff'); atmosphere.material.uniforms.k.value = lerp(.55,.4,k); }
  const fl = PLACES.find(p => p.id === 'floralis'); if(fl && fl.obj){ const open = lerp(1.0,.14,k); for(const pt of fl.obj.userData.petals) pt.rotation.x = open; }
}

/* ---------- Entrada animada ---------- */
let reveal = null;
const easeBack = x => { const c = 1.70158; return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2); };
function startReveal(){ if(REDUCED){ document.documentElement.classList.remove('intro'); return; }
  for(const p of PLACES){ p.delay = .5 + Math.hypot(...p.P)/45; p.obj.scale.setScalar(.001); }
  world.scale.setScalar(.7); reveal = { t0: performance.now() }; }
function stepReveal(){ if(!reveal) return; const e = (performance.now()-reveal.t0)/1000;
  world.scale.setScalar(.7+.3*(1-Math.pow(1-Math.min(1,e/2.2),3))); let done = e > 2.2;
  for(const p of PLACES){ const x = (e-p.delay)/.6; if(x < 1) done = false; p.obj.scale.setScalar(x <= 0 ? .001 : x >= 1 ? 1 : Math.max(.001,easeBack(x))); }
  if(done){ world.scale.setScalar(1); PLACES.forEach(p => p.obj.scale.setScalar(1)); reveal = null; document.documentElement.classList.remove('intro'); } }

/* ---------- Bucle ---------- */
let last = performance.now(), slowAcc = 0, slowN = 0, tStart = last;
function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); if(mode === 'over' && !flight) ov.dist = clamp(ov.dist,R*1.55,homeDist()*1.7); }
addEventListener('resize',resize);
function frame(now){ requestAnimationFrame(frame); update(now); }
function update(now){
  const dt = Math.min(.05,(now-last)/1000); last = now; const t = (now-tStart)/1000;
  stepReveal(); stepCamera(dt); stepMovers(dt,t); stepPeople(dt,t); stepNight(dt,t);
  const cam = PLACES.find(p => p.id === 'caminito'); if(cam && cam.obj) cam.obj.userData.tango.rotation.y = t*1.4;
  if(ringMark.visible) ringMark.material.opacity = .55+.35*Math.sin(t*3);
  renderer.render(scene,camera); stepLabels();
  if(t > 4 && t < 12){ slowAcc += dt; slowN++; if(slowN === 120 && slowAcc/slowN > .03 && renderer.getPixelRatio() > 1) renderer.setPixelRatio(1); }
}

/* ---------- Arranque ---------- */
const setPct = p => $('pct').style.width = Math.round(p)+'%';
const tick = () => new Promise(r => setTimeout(r,0));   // setTimeout: también avanza si la pestaña arranca en segundo plano
(async () => {
  try {
    renderTexts(); setSpin(spin); resize();
    ov.dist = homeDist()*1.25; ov.az = -.9; ov.el = .9; applyPose(poseOver());
    setPct(10); await tick(); buildPlanet();
    setPct(40); await tick(); buildStreets(); placeMonuments();
    setPct(60); await tick(); const stats = buildCity(); window.__baires = { stats, places: PLACES.map(p => ({ id:p.id, P:p.P.map(v => +v.toFixed(2)) })),
      advance: (sec=1) => { for(let i=0;i<sec*30;i++){ last -= 33; update(performance.now()); } } };   // para pruebas con la pestaña oculta
    setPct(85); await tick(); spawnTraffic(); spawnBoats(); spawnShips(); spawnPeople(); buildSubte(); buildStars();
    setPct(100); await tick();
    renderer.compile(scene,camera);
    startReveal(); ov.az = HOME.az; ov.el = HOME.el; ov.dist = homeDist(); flyTo('over',2.6);
    $('loader').classList.add('done');
    requestAnimationFrame(frame);
  } catch(err){ console.error(err); document.querySelector('.loader .word').textContent = T('loadErr'); }
})();
</script>
